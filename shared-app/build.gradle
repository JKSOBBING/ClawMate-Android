tasks.named('preBuild').configure {
    doFirst {
        if (!new File(runtimeDir, 'src/main/assets/arkui-x/entry/ets/modules.abc').isFile()) {
            throw new GradleException('Compile and package shared-frontend first; see shared-frontend/README.md')
        }
        project.exec {
            workingDir rootProject.projectDir
            commandLine 'node', 'shared-frontend/build-state.mjs', 'verify'
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        def manifest = new File(runtimeDir, 'src/main/assets/arkui-x/entry/module.json')
        def arkApp = new groovy.json.JsonSlurper().parse(manifest).app
        if (arkApp.buildMode != 'release' || arkApp.debug == true) {
            throw new GradleException('Recompile ArkTS in release mode using build.ps1 -BuildMode release or build-shared.sh --release')
        }
    }
}
