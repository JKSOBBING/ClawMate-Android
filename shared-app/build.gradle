// Internal debug deployments can nominate one HTTP inference service. Release keeps the main network policy.
abstract class DebugDeciderResources extends DefaultTask {
    @Input abstract Property<String> getOrigin()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()
    @TaskAction void generate() {
        def endpoint = new URI(origin.get())
        if (endpoint.scheme != 'http' || !endpoint.host?.matches('[A-Za-z0-9.-]+') || endpoint.userInfo != null ||
                endpoint.query != null || endpoint.fragment != null || !(endpoint.path in ['', '/']) ||
                !(endpoint.port == -1 || endpoint.port in 1..65535)) {
            throw new GradleException('clawmateDebugDeciderOrigin must be an HTTP origin without a path or credentials')
        }
        def res = outputDirectory.get().asFile
        new File(res, 'xml').mkdirs()
        new File(res, 'values').mkdirs()
        def hosts = ['127.0.0.1', endpoint.host].unique().collect { "<domain includeSubdomains=\"false\">${it}</domain>" }.join('')
        new File(res, 'xml/network_security_config.xml').setText(
            "<network-security-config><base-config cleartextTrafficPermitted=\"false\"/><domain-config cleartextTrafficPermitted=\"true\">${hosts}</domain-config></network-security-config>", 'UTF-8')
        new File(res, 'values/workflow_decider.xml').setText(
            "<resources><string name=\"workflow_decider_http_origin\" translatable=\"false\">${endpoint}</string></resources>", 'UTF-8')
    }
}
def debugDecider = providers.gradleProperty('clawmateDebugDeciderOrigin')
androidComponents.onVariants(androidComponents.selector().withBuildType('release')) { variant ->
    variant.applicationId.set('com.clawmate.app')
    variant.outputs.each {
        it.versionCode.set(3)
        it.versionName.set('1.1.0-rc.1')
    }
}
androidComponents.onVariants(androidComponents.selector().withBuildType('debug')) { variant ->
    if (debugDecider.isPresent()) {
        def generate = tasks.register("generate${variant.name.capitalize()}DeciderResources", DebugDeciderResources) {
            origin.set(debugDecider)
            outputDirectory.set(layout.buildDirectory.dir("generated/decider/${variant.name}/res"))
        }
        variant.sources.res.addGeneratedSourceDirectory(generate, { it.outputDirectory })
    }
}
