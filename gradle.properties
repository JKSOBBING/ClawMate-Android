# Project-wide Gradle settings.
# Heap sized for low-RAM CI/review boxes; raises with available memory.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Limit parallel workers for low-memory hosts (2 core / ~2 GB RAM).
org.gradle.workers.max=2
# AndroidX package structure.
android.useAndroidX=true
# Only keep the module(s) present in the project.
android.nonTransitiveRClass=true
# Kotlin code style for new modules.
kotlin.code.style=official
# Disable the Kotlin compiler daemon so it runs in-process (less memory).
kotlin.compiler.execution.strategy=in-process
