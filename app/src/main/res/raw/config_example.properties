# Safe example configuration — copy to local_config.properties and fill in real
# values. local_config.properties is intentionally git-ignored (see .gitignore).
#
# Copy this file to: app/src/main/res/raw/local_config.properties
# and uncomment/add your own endpoint values. The defaults below are empty so
# the app builds and launches without bundling any real credential.
#
# cloudPlannerBaseUrl: base URL of the OpenAI-compatible chat endpoint, e.g.
#   https://planner.example.com   (a bare host is normalized to .../v1/chat/completions)
# cloudPlannerModel:   model identifier sent in /v1/chat/completions
cloudPlannerBaseUrl=
cloudPlannerApiKey=
cloudPlannerModel=
cloudDeciderBaseUrl=
cloudDeciderApiKey=
